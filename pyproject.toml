[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "neko-files-local"
version = "0.4.1"
description = "Local repair workspace for a scoped QQ document reader"
requires-python = ">=3.12"
dependencies = [
  "maibot-plugin-sdk==2.16.0",
  "aiohttp>=3.12,<4",
  "PyMuPDF>=1.26,<2",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "tzdata",
]

[dependency-groups]
dev = ["ruff==0.15.11"]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
